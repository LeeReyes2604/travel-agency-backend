version: "3.9"

services:
  # --- Rails Application ---
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    command: bundle exec rails server -b 0.0.0.0 -p 3000
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  # --- Sidekiq ---
  sidekiq:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    command: bundle exec sidekiq
    restart: unless-stopped
    env_file:
      - .env
    stop_grace_period: 1m
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  # --- MySQL ---
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: travel_agency_backend_production
      MYSQL_USER: travel_agency_backend
      MYSQL_PASSWORD: ${DATABASE_PASSWORD}
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [
        "CMD",
        "mysqladmin",
        "ping",
        "-h",
        "localhost",
        "-u",
        "root",
        "-p${DB_ROOT_PASSWORD}"
      ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # --- Redis ---
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - app-network

volumes:
  mysql_data:
  redis_data:

networks:
  app-network:
    driver: bridge